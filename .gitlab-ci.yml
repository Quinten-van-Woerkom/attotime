stages:
  - check
  - test
  - verify

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

default:
  image: rust:latest
  cache:
    key: $CI_JOB_NAME
    paths:
      - .cargo/registry
      - target

fmt:
  stage: check
  cache: []
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --check

deny:
  stage: check
  cache:
    # Bump the version suffix to discard a cache in which `.cargo/bin` lacks the install metadata.
    key: $CI_JOB_NAME-v2
    paths:
      # `cargo install` needs its metadata files to recognise binaries restored from the cache.
      - .cargo/bin
      - .cargo/.crates.toml
      - .cargo/.crates2.json
      - .cargo/registry
  before_script:
    - cargo install --locked cargo-deny
  script:
    - cargo deny check

clippy:
  stage: check
  parallel:
    matrix:
      - FEATURES: ["--features default", "--no-default-features", "--all-features"]
  cache:
    key: $CI_JOB_NAME_SLUG
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --all-targets $FEATURES

test:
  stage: test
  parallel:
    matrix:
      - FEATURES: ["--features default", "--no-default-features", "--all-features"]
  cache:
    key: $CI_JOB_NAME_SLUG
  script:
    - cargo test $FEATURES

no-std:
  stage: test
  before_script:
    - rustup target add thumbv7em-none-eabihf
  script:
    - cargo build --no-default-features --target thumbv7em-none-eabihf

msrv:
  stage: test
  image: rust:1.85
  script:
    - cargo check --all-features

.kani:
  stage: verify
  cache:
    # Bump the version suffix to discard a cache in which `.cargo/bin` lacks the install metadata.
    key: $CI_JOB_NAME-v2
    paths:
      # `cargo install` needs its metadata files to recognise binaries restored from the cache.
      - .cargo/bin
      - .cargo/.crates.toml
      - .cargo/.crates2.json
      - .cargo/registry
      - target
  before_script:
    - cargo install --locked kani-verifier
    - cargo kani setup
  script:
    # Harnesses are independent, so verify them in parallel on all available cores.
    - cargo kani --jobs "$(nproc)" --output-format terse

# Calendar proofs are restricted to about 10,000 years around 1970, which keeps this job fast
# enough to run on every pipeline.
kani:
  extends: .kani

# Verifies the calendar proofs over the full range of `Date`. This takes too long to run on every
# pipeline, so it runs only in scheduled pipelines.
kani-full:
  extends: .kani
  variables:
    ATTOTIME_KANI_FULL_RANGE: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
