stages:
  - check
  - test
  - verify

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

default:
  image: rust:latest
  cache:
    key: $CI_JOB_NAME
    paths:
      - .cargo/registry
      - target

fmt:
  stage: check
  cache: []
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --check

clippy:
  stage: check
  parallel:
    matrix:
      - FEATURES: ["--features default", "--no-default-features", "--all-features"]
  cache:
    key: $CI_JOB_NAME_SLUG
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --all-targets $FEATURES

test:
  stage: test
  parallel:
    matrix:
      - FEATURES: ["--features default", "--no-default-features", "--all-features"]
  cache:
    key: $CI_JOB_NAME_SLUG
  script:
    - cargo test $FEATURES

no-std:
  stage: test
  before_script:
    - rustup target add thumbv7em-none-eabihf
  script:
    - cargo build --no-default-features --target thumbv7em-none-eabihf

msrv:
  stage: test
  image: rust:1.85
  script:
    - cargo check --all-features

kani:
  stage: verify
  cache:
    key: $CI_JOB_NAME
    paths:
      - .cargo/bin
      - .cargo/registry
      - target
  before_script:
    - cargo install --locked kani-verifier
    - cargo kani setup
  script:
    - cargo kani
