[package]
name = "attotime"
description = "High-fidelity time library for applications where sub-nanosecond accuracy and exact arithmetic are needed"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://gitlab.com/Quinten-van-Woerkom/attotime"

[features]
default = ["serde"]
std = ["derive_more/std", "lexical-core/std", "num-integer/std", "num-traits/std", "thiserror/std"]
serde = ["dep:serde", "std"]

[profile.dev]
opt-level=3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
derive_more = { version = "2.0.1", default-features = false, features = ["full"] }
lexical-core = { version = "1.0.6", default-features = false, features = ["parse-integers"] }
num-integer = { version = "0.1.46", default-features = false }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
serde = { version = "1.0.228", optional = true }
thiserror = { version = "2.0.17", default-features = false }

[dev-dependencies]
rand = "0.9.2"
rand_chacha = "0.9.0"

[lints.clippy]
pedantic = "warn"
nursery = "warn"