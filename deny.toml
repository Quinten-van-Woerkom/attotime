# Configuration for `cargo deny check`. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on any vulnerability, unmaintained or unsound crate in the dependency tree. Exceptions
# must be listed explicitly, with a reason.
unmaintained = "all"
ignore = []

[licenses]
# Every license in the dependency tree must be compatible with distribution under
# `MIT OR Apache-2.0`.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
